name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify generated CSS is in sync
        run: |
          cp src/design/tokens.css tokens.css.before
          cp src/design/theme.css theme.css.before
          npm run sync-tokens
          if ! diff -q src/design/tokens.css tokens.css.before > /dev/null 2>&1 || \
             ! diff -q src/design/theme.css theme.css.before > /dev/null 2>&1; then
            echo "::error::Generated CSS files are out of sync with tokens.json. Run 'npm run sync-tokens' and commit the results."
            exit 1
          fi

      - name: Validate compliance (no hardcoded hex)
        run: |
          if grep -rn '#[0-9a-fA-F]\{3,8\}' src/components/ --include='*.tsx' --include='*.ts' | grep -v 'hex:\|"#\|light:\|dark:'; then
            echo "::error::Found hardcoded hex values in components"
            exit 1
          fi

      - name: Validate compliance (no arbitrary colors)
        run: |
          if grep -rn '\[#' src/components/ --include='*.tsx' --include='*.ts'; then
            echo "::error::Found Tailwind arbitrary color values in components"
            exit 1
          fi

      - name: Validate compliance (no Tailwind defaults)
        run: |
          if grep -rEn 'bg-(gray|slate|zinc|stone|neutral|red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|pink|rose)-[0-9]' src/components/ --include='*.tsx' --include='*.ts'; then
            echo "::error::Found Tailwind default palette usage in components"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
