name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tokens.css and theme.css are generated by the prebuild hook,
      # so `npm run build` below also exercises the transformer.
      - name: Validate token-only styling
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
