name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The generated CSS and tokens.generated.ts are gitignored, so they must
      # exist before lint runs (it type-resolves the import). The prebuild hook
      # would cover the build step alone, but not the steps before it.
      - name: Generate design tokens
        run: npm run sync-tokens

      - name: Validate token-only styling
        run: npm run validate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
